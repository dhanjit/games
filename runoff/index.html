<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1c2530" />
  <title>Runoff</title>
  <meta name="description" content="The monsoon's over and the sun is out. Tilt your phone to tip the last rainwater off the ledges and down the alley before it evaporates." />
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
</head>
<body>
  <canvas id="view"></canvas>

  <header id="hud" class="hide">
    <div class="stat"><span class="label">depth</span><span id="depth">0 m</span></div>
    <div class="stat"><span class="label">water</span><span id="drops">0</span></div>
    <div class="spacer"></div>
    <div class="stat right"><span class="label">best</span><span id="best">0 m</span></div>
  </header>

  <div id="title" class="overlay show">
    <div class="panel">
      <h1>Runoff</h1>
      <p class="tag">The monsoon's over. The sun is out.<br />Get the last of the rain down the alley before it burns off.</p>
      <button class="mode primary" data-mode="chase">
        <strong>Chase</strong><span>The sun comes down after you, faster and faster.</span>
      </button>
      <button class="mode" data-mode="scroll">
        <strong>Scroll</strong><span>Thumb the alley down yourself. Whatever you scroll past burns.</span>
      </button>
      <p class="how">Tilt your phone to tip water off the ledges.<br />
        <span id="noTilt">No tilt sensor? Hold ← / → (or A / D), or press and drag sideways.</span></p>
    </div>
  </div>

  <div id="over" class="overlay">
    <div class="panel">
      <h2>Evaporated</h2>
      <p class="big"><span id="finalDepth">0</span> m</p>
      <p class="dim">best <span id="finalBest">0</span> m · <span id="finalMode">chase</span></p>
      <button id="btnAgain" class="primary">Again</button>
      <button id="btnMenu">Modes</button>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
